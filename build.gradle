buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.31'
    }
}

apply plugin: 'idea'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

repositories {
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url "https://cursemaven.com" }
    mavenCentral()
}

version = '1.0'
group = 'fr.iamacat.biggesspacktweaks'
archivesBaseName = 'biggesspacktweak'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    accessTransformer = file('src/main/resources/META-INF/biggesspacktweak_at.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=biggesspacktweak.mixin.json"
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'

    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'

    implementation "curse.maven:infinite-abyss-677576:4963428-deobf-sources-api"
    implementation "curse.maven:mutant-more-539994:4418147-deobf-sources-api"
    implementation "curse.maven:geckolib-388172:4182600-deobf-sources-api"
    implementation "curse.maven:deuf-duplicate-entity-uuid-fix-296646:3885123-deobf-sources-api"
}

mixin {
    add sourceSets.main, "biggesspacktweak.mixin-refmap.json"
    config "biggesspacktweak.mixin.json"
}

jar {
    manifest {
        attributes([
                "Specification-Title": "biggesspacktweak",
                "Specification-Vendor": "biggesspacktweakareus",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"biggesspacktweakareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
                "TweakOrder": 0,
                "MixinConfigs" : "biggesspacktweak.mixin.json",
                "FMLAT": "biggesspacktweak_at.cfg"
        ])
    }
}

jar.finalizedBy('reobfJar')